<!--
  [テンプレート] cta(最終行動喚起)セクション サンプル

  役割: LP最下部に配置する最後の後押し + フォーム。
  CRO知見:
    - フォームの入力項目は少ないほどCVRが高い傾向がある(Baymard Instituteの知見)。
      このサンプルではメールアドレスのみを必須項目としている。
    - ボタン文言は「送信する」ではなく行動後の利益を明示する
      (例:「無料で始める」「資料を今すぐ受け取る」)。

  プレースホルダー:
    {{CTA_HEADLINE}}      見出し(最後の後押し)
    {{CTA_SUBCOPY}}       補足コピー
    {{CTA_BUTTON_TEXT}}   送信ボタン文言(行動後の利益を明示)
-->
<section class="cta" id="cta">
  <h2 class="cta-headline">{{CTA_HEADLINE}}</h2>
  <p class="cta-subcopy">{{CTA_SUBCOPY}}</p>

  <!-- フェーズ1では送信先サーバーがないため action は "#"(ダミー)。
       フェーズ2でイベント計測API/フォーム受付APIに接続する。 -->
  <form class="cta-form" action="#" method="post">
    <label class="visually-hidden" for="email">メールアドレス</label>
    <input type="email" id="email" name="email" placeholder="メールアドレス" required>
    <button type="submit" class="btn btn-primary">{{CTA_BUTTON_TEXT}}</button>
  </form>
</section>
